<!DOCTYPE html>

<html data-theme="light">
    <title>YTRoulette</title>

    <style>
        :root {
            --bg: #e6e6e6;
            --text: #000;
            --btn-bg: black;
            --btn-text: white;
            --credits-color: black;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --btn-bg: white;
            --btn-text: black;
            --credits-color: #f0f0f0;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: sans-serif;
            text-align: center;
            flex-direction: column;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        img {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin: 20px 0;
            transition: transform 3s ease-out;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .credits {
            position: fixed;
            bottom: 10px;
            font-size: 14px;
        }

        .credits a {
            color: var(--credits-color);
            text-decoration: none;
            font-weight: bold;
        }

        .credits a:hover {
            text-decoration: underline;
        }

        #darkToggle {
            position: fixed;
            top: 14px;
            right: 16px;
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }
    </style>

    <h1>YTRoulette</h1>

    <img id="wheel" src="https://iili.io/BLiviHg.png" width="627" height="627" />

    <button onclick="spinWheel()">spin!</button>

    <div class="credits">
        made by <a href="https://x.com/zenithiso" target="_blank">@zenith.iso</a> —
        inspired by <a href="https://www.youtube.com/@KVNAUST" target="_blank">KVN AUST</a>
    </div>

    <button id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>

    <script>
    const queryPool = ["MOV XXXX", "MVI XXXX", "IMG XXXX", "GOPRXXXX", "SAM XXXX", "DSC XXXX", "DSCFXXXX", "SDV XXXX"];

    let totalRotation = 0;

    function toggleDark() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('darkToggle').textContent = isDark ? '🌙' : '☀️';
    }

    function spinWheel() {
        const wheel = document.getElementById("wheel");

        const spins = Math.floor(Math.random() * 3) + 3;
        const extra = Math.random() * 360;

        totalRotation += spins * 360 + extra;
        wheel.style.transform = "rotate(" + totalRotation + "deg)";

        setTimeout(() => {
            Gen();
        }, 3000);
    }

    function Gen() {
        const selection = queryPool[Math.floor(Math.random() * queryPool.length)];
        const digit = String(Math.floor(Math.random() * 9999) + 1).padStart(4, '0');
        const randomized = selection.replace("XXXX", digit);
        const url = `https://www.youtube.com/results?search_query="${encodeURIComponent(randomized)}"`;
        window.open(url, '_blank');
    }
    </script>

</html>
